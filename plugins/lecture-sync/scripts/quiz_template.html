<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --lane:#eceff5; --ink:#1b2231; --ink2:#38425a; --muted:#5d677c;
  --line:#d3d9e3; --acc:#2f6db5; --acc-f:#dbe8f7;
  --ok:#1f7a4a; --ok-f:#dcf1e4; --no:#b3304a; --no-f:#f9e0e5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11141b; --surface:#191d27; --lane:#20252f; --ink:#e7eaf1; --ink2:#c3cadb; --muted:#97a1b6;
    --line:#333b4c; --acc:#6aa6e8; --acc-f:#1c2f4a;
    --ok:#5fcf8e; --ok-f:#173524; --no:#ec7d93; --no-f:#3d1a22;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11141b; --surface:#191d27; --lane:#20252f; --ink:#e7eaf1; --ink2:#c3cadb; --muted:#97a1b6;
  --line:#333b4c; --acc:#6aa6e8; --acc-f:#1c2f4a;
  --ok:#5fcf8e; --ok-f:#173524; --no:#ec7d93; --no-f:#3d1a22;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.7;padding-inline:clamp(16px,3vw,32px);padding-block:28px 64px}
main{max-width:820px;margin-inline:auto}
.meta{margin:0 0 6px;font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
.meta code{font-family:"IBM Plex Mono",monospace;font-size:12px}
h1{font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;font-weight:700;font-size:clamp(23px,3.2vw,30px);line-height:1.3;margin:0 0 8px;text-wrap:balance}
.links{margin:0 0 18px;font-size:14px;font-weight:500}
a{color:var(--acc)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:14px;font-variant-numeric:tabular-nums}
.bar b{font-size:16px}
.bar .grow{flex:1}
ol.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px;counter-reset:q}
.q{counter-increment:q;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px clamp(16px,2.4vw,24px)}
.qh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qh::before{content:counter(q) "번";font-family:"IBM Plex Sans KR",sans-serif;font-weight:700;font-size:15px}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--acc);background:var(--acc-f);border-radius:5px;padding:1px 7px}
.q.done-ok{border-color:var(--ok)}
.q.done-no{border-color:var(--no)}
.qt p{margin:0 0 8px}
.qt ul,.qt ol{margin:0 0 8px;padding-left:1.3em}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choices.tf{flex-direction:row;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.ch{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;line-height:1.55}
.tf .ch{width:auto;min-width:120px}
.ch:hover:not(:disabled){border-color:var(--acc)}
.ch:disabled{cursor:default}
.ch .k{flex:none;font-weight:700;color:var(--muted);min-width:1.1em;font-variant-numeric:tabular-nums}
.ch.right{border-color:var(--ok);background:var(--ok-f)}
.ch.right .k{color:var(--ok)}
.ch.wrong{border-color:var(--no);background:var(--no-f)}
.ch.wrong .k{color:var(--no)}
textarea{width:100%;margin-top:10px;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.reveal,.self button,.reset{background:var(--acc-f);border:1px solid var(--acc);color:var(--acc);border-radius:7px;padding:4px 14px;font-weight:500;font-size:14px}
.self button.on[data-self="1"]{background:var(--ok-f);border-color:var(--ok);color:var(--ok)}
.self button.on[data-self="0"]{background:var(--no-f);border-color:var(--no);color:var(--no)}
.sol{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.sol .ans{font-weight:700;margin:0 0 6px}
.sol p{margin:0 0 8px;max-width:72ch}
.sol ul,.sol ol{margin:0 0 8px;padding-left:1.3em}
.ref{font-size:13px;color:var(--muted)}
.math{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;margin:6px 0 10px;padding:8px 12px;background:var(--lane);border-radius:6px;overflow-x:auto;white-space:nowrap}
.tw{overflow-x:auto;margin:0 0 10px}
table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:var(--lane)}
code{font-family:"IBM Plex Mono",monospace;font-size:.9em;background:var(--lane);padding:1px 5px;border-radius:4px}
sub,sup{font-size:.72em}
</style>
<main data-key="{{KEY}}">
<p class="meta">{{WEEK}} · <code>{{SOURCE}}</code> · {{NQ}}문제</p>
<h1>{{TOPIC}} 퀴즈</h1>
<p class="links">{{LINKS}}</p>

<div class="bar" role="status" aria-live="polite">
<span>푼 문제 <b id="done">0</b> / {{NQ}}</span>
<span>맞힌 문제 <b id="ok">0</b></span>
<span class="grow"></span>
<button type="button" class="reset" id="reset">처음부터 다시 풀기</button>
</div>

<ol class="qs">
{{QUESTIONS}}
</ol>
</main>
<script>
(function(){
  var key = "quiz:" + document.querySelector("main").getAttribute("data-key");
  var qs = Array.prototype.slice.call(document.querySelectorAll(".q"));
  var st = {};
  try { st = JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (e) { st = {}; }
  function save(){ try { localStorage.setItem(key, JSON.stringify(st)); } catch (e) {} }
  function score(){
    var d = 0, o = 0;
    qs.forEach(function(q){ var s = st[q.id]; if (s && s.r !== undefined){ d++; if (s.r) o++; } });
    document.getElementById("done").textContent = d;
    document.getElementById("ok").textContent = o;
  }
  function mark(q, r){
    q.classList.remove("done-ok","done-no");
    if (r !== undefined) q.classList.add(r ? "done-ok" : "done-no");
  }
  function pick(q, i, silent){
    var ans = q.getAttribute("data-ans");
    q.querySelectorAll(".ch").forEach(function(b){
      b.disabled = true;
      if (b.getAttribute("data-i") === ans) b.classList.add("right");
      else if (b.getAttribute("data-i") === i) b.classList.add("wrong");
    });
    q.querySelector(".sol").hidden = false;
    var r = (i === ans);
    mark(q, r);
    if (!silent){ st[q.id] = {c:i, r:r}; save(); score(); }
  }
  function reveal(q){
    q.querySelector(".sol").hidden = false;
    var b = q.querySelector(".reveal"); if (b) b.hidden = true;
  }
  function self(q, v, silent){
    q.querySelectorAll(".self button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-self") === v); });
    var r = (v === "1");
    mark(q, r);
    if (!silent){ var s = st[q.id] || {}; s.r = r; s.v = v; s.o = 1; st[q.id] = s; save(); score(); }
  }
  qs.forEach(function(q){
    var t = q.getAttribute("data-type");
    var s = st[q.id];
    if (t === "mc" || t === "tf"){
      q.querySelectorAll(".ch").forEach(function(b){
        b.addEventListener("click", function(){ if (!b.disabled) pick(q, b.getAttribute("data-i")); });
      });
      if (s && s.c !== undefined) pick(q, s.c, true);
    } else {
      var ta = q.querySelector("textarea");
      ta.addEventListener("input", function(){ var x = st[q.id] || {}; x.t = ta.value; st[q.id] = x; save(); });
      q.querySelector(".reveal").addEventListener("click", function(){
        reveal(q); var x = st[q.id] || {}; x.o = 1; st[q.id] = x; save();
      });
      q.querySelectorAll(".self button").forEach(function(b){
        b.addEventListener("click", function(){ self(q, b.getAttribute("data-self")); });
      });
      if (s){
        if (s.t) ta.value = s.t;
        if (s.o) reveal(q);
        if (s.v !== undefined) self(q, s.v, true);
      }
    }
  });
  score();
  document.getElementById("reset").addEventListener("click", function(){
    st = {}; save();
    qs.forEach(function(q){
      mark(q);
      q.querySelector(".sol").hidden = true;
      q.querySelectorAll(".ch").forEach(function(b){ b.disabled = false; b.classList.remove("right","wrong"); });
      q.querySelectorAll(".self button").forEach(function(b){ b.classList.remove("on"); });
      var r = q.querySelector(".reveal"); if (r) r.hidden = false;
      var ta = q.querySelector("textarea"); if (ta) ta.value = "";
    });
    score();
    window.scrollTo(0, 0);
  });
})();
</script>
