<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --lane:#eceff5; --ink:#1b2231; --ink2:#38425a; --muted:#5d677c;
  --line:#d3d9e3; --acc:#2f6db5; --acc-f:#dbe8f7;
  --bg-s:#2b8580; --dt-s:#7551b5; --ex-s:#bf6417; --ex-f:#fdf3e8;
  --warn:#9a3b12; --warn-f:#fbe9e0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11141b; --surface:#191d27; --lane:#20252f; --ink:#e7eaf1; --ink2:#c3cadb; --muted:#97a1b6;
    --line:#333b4c; --acc:#6aa6e8; --acc-f:#1c2f4a;
    --bg-s:#4db1ab; --dt-s:#a68be0; --ex-s:#df8f3d; --ex-f:#2a2117;
    --warn:#f0a07a; --warn-f:#3a2219;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11141b; --surface:#191d27; --lane:#20252f; --ink:#e7eaf1; --ink2:#c3cadb; --muted:#97a1b6;
  --line:#333b4c; --acc:#6aa6e8; --acc-f:#1c2f4a;
  --bg-s:#4db1ab; --dt-s:#a68be0; --ex-s:#df8f3d; --ex-f:#2a2117;
  --warn:#f0a07a; --warn-f:#3a2219;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.75;padding-inline:clamp(16px,3vw,32px);padding-block:28px 64px}
.wrap{max-width:1180px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media (min-width:1060px){.wrap{grid-template-columns:240px minmax(0,1fr)}}
header,.intro{grid-column:1 / -1}
.meta{margin:0 0 6px;font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
.meta code{font-family:"IBM Plex Mono",monospace;font-size:12px}
h1{font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;font-weight:700;font-size:clamp(23px,3.2vw,30px);line-height:1.3;margin:0 0 10px;text-wrap:balance}
h2{font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;font-size:16px;margin:0 0 10px}
.lead{margin:0;max-width:70ch;color:var(--ink2)}
.links{margin:12px 0 0;font-size:14px;font-weight:500}
a{color:var(--acc)}
.intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.box ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.box.wide{grid-column:1 / -1}
.warnbox{border-color:var(--warn);background:var(--warn-f)}
.warnbox h2{color:var(--warn)}
nav.toc{font-size:13.5px}
nav.toc details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
nav.toc summary{font-weight:700;cursor:pointer}
nav.toc ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
nav.toc a{display:flex;gap:8px;padding:3px 4px;border-radius:5px;color:var(--ink2);text-decoration:none;line-height:1.45}
nav.toc a:hover{background:var(--lane);color:var(--ink)}
nav.toc .no{flex:none;width:2.2em;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
@media (min-width:1060px){
  nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow:auto}
}
.slides{display:flex;flex-direction:column;gap:22px;min-width:0}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px clamp(16px,2.4vw,26px);scroll-margin-top:16px}
.slide h3{font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;font-size:18px;line-height:1.4;margin:0 0 14px;display:flex;gap:10px;align-items:baseline;text-wrap:balance}
.slide h3 .no{flex:none;font-size:13px;font-weight:700;color:var(--acc);background:var(--acc-f);border-radius:6px;padding:1px 8px;font-variant-numeric:tabular-nums}
.slide.brief{padding-block:14px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.part{margin-top:14px}
.pair .part{margin-top:0}
.part h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.part p{margin:0 0 10px;max-width:72ch}
.part p:last-child{margin-bottom:0}
.part ul,.part ol{margin:0 0 10px;padding-left:1.3em;max-width:72ch}
.orig pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;line-height:1.6;color:var(--ink2);background:var(--lane);border-radius:8px;padding:10px 12px}
.bg{border-left:3px solid var(--bg-s);padding-left:14px}
.bg h4{color:var(--bg-s)}
.dt{border-left:3px solid var(--dt-s);padding-left:14px}
.dt h4{color:var(--dt-s)}
.ex{background:var(--ex-f);border-left:3px solid var(--ex-s);border-radius:0 8px 8px 0;padding:10px 14px}
.ex h4{color:var(--ex-s)}
.warn{margin:14px 0 0;font-size:13.5px;color:var(--warn);background:var(--warn-f);border-radius:6px;padding:6px 10px}
.math,td.m{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px}
.math{margin:6px 0 10px;padding:8px 12px;background:var(--lane);border-radius:6px;overflow-x:auto;white-space:nowrap}
.tw{overflow-x:auto;margin:0 0 10px}
table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--lane);font-weight:700}
code{font-family:"IBM Plex Mono",monospace;font-size:.9em;background:var(--lane);padding:1px 5px;border-radius:4px}
sub,sup{font-size:.72em}
.top{display:inline-block;margin-top:8px;font-size:13px}
.flow .goal{margin:0 0 14px;max-width:80ch;color:var(--ink2)}
.flow b{color:var(--ink);margin-right:4px}
.flow ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.flow li{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.flow li p{margin:6px 0 0;color:var(--ink2)}
.fh{display:flex;gap:8px;align-items:baseline;font-weight:700;text-decoration:none;color:var(--ink)}
.fh:hover{color:var(--acc)}
.sid{flex:none;font-size:12px;font-weight:700;color:var(--acc);background:var(--acc-f);border-radius:5px;padding:0 7px}
.rng{margin-left:auto;flex:none;font-size:12px;font-weight:500;color:var(--muted)}
nav.toc li.grp{margin-top:8px}
nav.toc li.grp:first-child{margin-top:0}
nav.toc a.gh{font-weight:700;color:var(--ink)}
nav.toc a.gh .no{color:var(--acc)}
nav.toc li.grp ol{margin:2px 0 0;padding-left:10px;border-left:2px solid var(--line)}
.sec{background:var(--acc-f);border:1px solid var(--acc);border-radius:12px;padding:16px clamp(16px,2.4vw,26px);scroll-margin-top:16px}
.sec .k{margin:0 0 4px;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--acc)}
.sec h2{font-size:20px;margin:0 0 8px}
.sec p{margin:6px 0 0;max-width:80ch;color:var(--ink2)}
.sec b,.concl b{color:var(--ink);margin-right:4px}
.crumb{margin:0 0 4px;font-size:12.5px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--acc);text-decoration:underline}
.concl{margin:0 0 14px;padding:8px 12px;border-left:3px solid var(--acc);background:var(--lane);border-radius:0 6px 6px 0;font-size:14.5px;max-width:80ch;color:var(--ink2)}
</style>
<div class="wrap">
<header>
<p class="meta">{{WEEK}} · <code>{{SOURCE}}</code> · {{NSLIDES}}장</p>
<h1>{{TOPIC}}</h1>
<p class="lead">{{LEAD}}</p>
<p class="links">{{LINKS}}</p>
</header>

{{FLOW}}
<div class="intro">
{{PREREQ}}
{{UNVERIFIED}}
</div>
<div class="intro">
{{FORMULAS}}
</div>

<nav class="toc" aria-label="목차">
<details open id="tocbox"><summary>목차</summary>
<ol>
{{TOC}}
</ol>
</details>
</nav>

<main class="slides">
{{SLIDES}}
<a class="top" href="#tocbox">목차로 이동</a>
</main>
</div>
<script>
(function(){
  var box = document.getElementById("tocbox");
  var mq = window.matchMedia("(min-width:1060px)");
  function sync(){ if (mq.matches) box.open = true; }
  sync();
  if (mq.addEventListener) mq.addEventListener("change", sync);
  if (!mq.matches) box.open = false;
})();
</script>
