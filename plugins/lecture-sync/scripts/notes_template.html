<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --lane:#eceff5; --ink:#1b2231; --ink2:#38425a; --muted:#5d677c;
  --line:#d3d9e3; --acc:#2f6db5; --acc-f:#dbe8f7;
  --bg-s:#2b8580; --dt-s:#7551b5; --lec-s:#3d7a3a; --ex-s:#bf6417; --ex-f:#fdf3e8;
  --warn:#9a3b12; --warn-f:#fbe9e0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11141b; --surface:#191d27; --lane:#20252f; --ink:#e7eaf1; --ink2:#c3cadb; --muted:#97a1b6;
    --line:#333b4c; --acc:#6aa6e8; --acc-f:#1c2f4a;
    --bg-s:#4db1ab; --dt-s:#a68be0; --lec-s:#7cc377; --ex-s:#df8f3d; --ex-f:#2a2117;
    --warn:#f0a07a; --warn-f:#3a2219;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11141b; --surface:#191d27; --lane:#20252f; --ink:#e7eaf1; --ink2:#c3cadb; --muted:#97a1b6;
  --line:#333b4c; --acc:#6aa6e8; --acc-f:#1c2f4a;
  --bg-s:#4db1ab; --dt-s:#a68be0; --lec-s:#7cc377; --ex-s:#df8f3d; --ex-f:#2a2117;
  --warn:#f0a07a; --warn-f:#3a2219;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.75;padding-inline:clamp(16px,3vw,32px);padding-block:28px 64px}
.wrap{max-width:1180px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media (min-width:1060px){.wrap{grid-template-columns:240px minmax(0,1fr)}}
header,.intro{grid-column:1 / -1}
.meta{margin:0 0 6px;font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
.meta code{font-family:"IBM Plex Mono",monospace;font-size:12px}
h1{font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;font-weight:700;font-size:clamp(23px,3.2vw,30px);line-height:1.3;margin:0 0 10px;text-wrap:balance}
h2{font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;font-size:16px;margin:0 0 10px}
.lead{margin:0;max-width:70ch;color:var(--ink2)}
.links{margin:12px 0 0;font-size:14px;font-weight:500}
a{color:var(--acc)}
.intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.box ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.box.wide{grid-column:1 / -1}
.warnbox{border-color:var(--warn);background:var(--warn-f)}
.warnbox h2{color:var(--warn)}
nav.toc{font-size:13.5px}
nav.toc details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
nav.toc summary{font-weight:700;cursor:pointer}
nav.toc ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
nav.toc a{display:flex;gap:8px;padding:3px 4px;border-radius:5px;color:var(--ink2);text-decoration:none;line-height:1.45}
nav.toc a:hover{background:var(--lane);color:var(--ink)}
nav.toc .no{flex:none;width:2.2em;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
@media (min-width:1060px){
  nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow:auto}
}
.slides{display:flex;flex-direction:column;gap:22px;min-width:0}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px clamp(16px,2.4vw,26px);scroll-margin-top:16px}
.slide h3{font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;font-size:18px;line-height:1.4;margin:0 0 14px;display:flex;gap:10px;align-items:baseline;text-wrap:balance}
.slide h3 .no{flex:none;font-size:13px;font-weight:700;color:var(--acc);background:var(--acc-f);border-radius:6px;padding:1px 8px;font-variant-numeric:tabular-nums}
.slide.brief{padding-block:14px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.part{margin-top:14px}
.pair .part{margin-top:0}
.part h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.part p{margin:0 0 10px;max-width:72ch}
.part p:last-child{margin-bottom:0}
.part ul,.part ol{margin:0 0 10px;padding-left:1.3em;max-width:72ch}
.orig pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;line-height:1.6;color:var(--ink2);background:var(--lane);border-radius:8px;padding:10px 12px}
.bg{border-left:3px solid var(--bg-s);padding-left:14px}
.bg h4{color:var(--bg-s)}
.dt{border-left:3px solid var(--dt-s);padding-left:14px}
.dt h4{color:var(--dt-s)}
.lec{border-left:3px solid var(--lec-s);padding-left:14px}
.lec h4{color:var(--lec-s)}
.ex{background:var(--ex-f);border-left:3px solid var(--ex-s);border-radius:0 8px 8px 0;padding:10px 14px}
.ex h4{color:var(--ex-s)}
.warn{margin:14px 0 0;font-size:13.5px;color:var(--warn);background:var(--warn-f);border-radius:6px;padding:6px 10px}
.math,td.m{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px}
.math{margin:6px 0 10px;padding:8px 12px;background:var(--lane);border-radius:6px;overflow-x:auto;white-space:nowrap}
.tw{overflow-x:auto;margin:0 0 10px}
table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--lane);font-weight:700}
code{font-family:"IBM Plex Mono",monospace;font-size:.9em;background:var(--lane);padding:1px 5px;border-radius:4px}
sub,sup{font-size:.72em}
.top{display:inline-block;margin-top:8px;font-size:13px}
.flow .goal{margin:0 0 14px;max-width:80ch;color:var(--ink2)}
.flow b{color:var(--ink);margin-right:4px}
.flow ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.flow li{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.flow li p{margin:6px 0 0;color:var(--ink2)}
.fh{display:flex;gap:8px;align-items:baseline;font-weight:700;text-decoration:none;color:var(--ink)}
.fh:hover{color:var(--acc)}
.sid{flex:none;font-size:12px;font-weight:700;color:var(--acc);background:var(--acc-f);border-radius:5px;padding:0 7px}
.rng{margin-left:auto;flex:none;font-size:12px;font-weight:500;color:var(--muted)}
nav.toc li.grp{margin-top:8px}
nav.toc li.grp:first-child{margin-top:0}
nav.toc a.gh{font-weight:700;color:var(--ink)}
nav.toc a.gh .no{color:var(--acc)}
nav.toc li.grp ol{margin:2px 0 0;padding-left:10px;border-left:2px solid var(--line)}
.sec{background:var(--acc-f);border:1px solid var(--acc);border-radius:12px;padding:16px clamp(16px,2.4vw,26px);scroll-margin-top:16px}
.sec .k{margin:0 0 4px;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--acc)}
.sec h2{font-size:20px;margin:0 0 8px}
.sec p{margin:6px 0 0;max-width:80ch;color:var(--ink2)}
.sec b,.concl b{color:var(--ink);margin-right:4px}
.crumb{margin:0 0 4px;font-size:12.5px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--acc);text-decoration:underline}
.concl{margin:0 0 14px;padding:8px 12px;border-left:3px solid var(--acc);background:var(--lane);border-radius:0 6px 6px 0;font-size:14.5px;max-width:80ch;color:var(--ink2)}
.figgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fig img{display:block;width:100%;height:auto;border-radius:6px;background:#fff}
.fig svg{display:block;width:100%;max-width:600px;margin:0 auto;height:auto;font-family:inherit;overflow:visible}
.fig figcaption{font-size:13px;color:var(--ink2);line-height:1.6}
.ftag{display:inline-block;margin-right:6px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--acc-f);color:var(--acc)}
.slide-img .ftag{background:var(--lane);color:var(--muted)}
.fig svg text{fill:var(--ink);font-size:13px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.fig svg .mut{fill:var(--muted);font-size:11.5px}
.fig svg .ln{stroke:var(--ink2);fill:none;stroke-width:1.6}
.fig svg .lna{stroke:var(--acc);fill:none;stroke-width:2.2}
.fig svg .lnw{stroke:var(--ex-s);fill:none;stroke-width:2.2}
.fig svg .lnt{stroke:var(--bg-s);fill:none;stroke-width:2.2}
.fig svg .dash{stroke-dasharray:6 5}
.fig svg .bx{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.fig svg .bxa{fill:var(--acc-f);stroke:var(--acc);stroke-width:1.4}
.fig svg .bxw{fill:var(--ex-f);stroke:var(--ex-s);stroke-width:1.4}
.fig svg .bxt{fill:var(--lane);stroke:var(--bg-s);stroke-width:1.4}
.fig svg .dot{fill:var(--ink2)}
.fig svg .dota{fill:var(--acc)}
.fig svg .dotw{fill:var(--ex-s)}
.fig svg .dott{fill:var(--bg-s)}
.fig svg .dotp{fill:var(--dt-s)}
.fig.wide{grid-column:1 / -1}
.ex-tag .ftag{background:var(--ex-f);color:var(--ex-s)}
:root{--st-run:#3b78c4;--st-res1:#d9822b;--st-res2:#8a5cc7;--st-res3:#2b9488;--st-wait:#dfe4ec;--st-blk:#d0453c;--st-ceil:#ec8fb0;--st-dead:#7d1d17;--st-grid:#cfd6e1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--st-run:#5c97e0;--st-res1:#e39a4f;--st-res2:#a888e3;--st-res3:#4fb8aa;--st-wait:#3d4759;--st-blk:#e2685f;--st-ceil:#c9729a;--st-dead:#f0a07a;--st-grid:#3a4252}}
:root[data-theme="dark"]{--st-run:#5c97e0;--st-res1:#e39a4f;--st-res2:#a888e3;--st-res3:#4fb8aa;--st-wait:#3d4759;--st-blk:#e2685f;--st-ceil:#c9729a;--st-dead:#f0a07a;--st-grid:#3a4252}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.ctl button{font:inherit;font-size:12.5px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-width:34px}
.ctl button:hover{border-color:var(--acc);color:var(--acc)}
.ctl button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ctl input[type=range]{flex:1 1 140px;min-width:120px;accent-color:var(--acc)}
.ctl .tnow{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink2);min-width:7.5em}
.tlsc{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tlsc svg{display:block;max-width:none;width:auto;margin:0}
.tlsc text,.fig .tlsc svg text{fill:var(--ink);font-size:12px;stroke:none;paint-order:normal}
.fig .tlsc svg text.ax{fill:var(--muted);font-size:10.5px}
.tlsc .gl{stroke:var(--st-grid);stroke-width:1}
.tlsc .cur{stroke:var(--acc);stroke-width:2}
.tlsc .c-W{fill:var(--st-wait)} .tlsc .c-R{fill:var(--st-run)} .tlsc .c-B{fill:var(--st-blk)} .tlsc .c-K{fill:var(--st-ceil)} .tlsc .c-D{fill:var(--st-dead)}
.tlsc .c-r0{fill:var(--st-res1)} .tlsc .c-r1{fill:var(--st-res2)} .tlsc .c-r2{fill:var(--st-res3)}
.tlsc .fut{fill:none;stroke:var(--st-grid);stroke-dasharray:2 3}
.fig .tlsc svg text.cl{fill:#fff;font-size:10.5px;font-weight:700}
.fig .tlsc svg text.pr{fill:var(--ink2);font-size:9.5px}
.tlsc .mk-rel{fill:var(--ink2)} .tlsc .mk-dl{stroke:var(--ink2);stroke-width:1.6;fill:none} .tlsc .mk-done{fill:#3aa35b} .tlsc .mk-miss{stroke:var(--st-blk);stroke-width:2.4}
.tlst{margin:0;font-size:13px;line-height:1.65;color:var(--ink2);background:var(--lane);border-radius:8px;padding:8px 11px;min-height:3.4em}
.tlst b{color:var(--ink)}
.tlleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin:0;padding:0;list-style:none}
.tlleg i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.frm .fr[hidden]{display:none}
.frm .frt{margin:8px 0 0;font-size:13px;line-height:1.65;color:var(--ink2);background:var(--lane);border-radius:8px;padding:8px 11px}
.frm .dots{display:flex;gap:4px}
.frm .dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.frm .dots span.on{background:var(--acc)}
</style>

<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--ex-s)"/></marker>

<script>
(function(){
  var NS = "http://www.w3.org/2000/svg";
  function num(x){ return String(Math.round(x * 1000) / 1000); }
  function el(tag, attrs, txt){ var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (txt != null) e.textContent = txt; return e; }
  function controls(root, n, label){
    var c = document.createElement("div"); c.className = "ctl";
    c.innerHTML = '<button type="button" data-a="first" aria-label="처음으로">⏮</button><button type="button" data-a="prev" aria-label="한 단계 뒤로">◀</button><button type="button" data-a="play" aria-label="재생">재생</button><button type="button" data-a="next" aria-label="한 단계 앞으로">▶</button><button type="button" data-a="last" aria-label="끝으로">⏭</button><input type="range" min="0" step="1" aria-label="' + label + '"><span class="tnow"></span>';
    c.querySelector("input").max = n;
    root.insertBefore(c, root.firstChild);
    return c;
  }
  function player(c, n, start, draw){
    var pos = start, timer = null, rng = c.querySelector("input"), pb = c.querySelector('[data-a="play"]');
    function set(p){ pos = Math.max(0, Math.min(n, p)); rng.value = pos; draw(pos); }
    function stop(){ if (timer){ clearInterval(timer); timer = null; pb.textContent = "재생"; pb.setAttribute("aria-label","재생"); } }
    c.addEventListener("click", function(ev){
      var a = ev.target.getAttribute && ev.target.getAttribute("data-a"); if (!a) return;
      if (a === "play"){
        if (timer){ stop(); return; }
        if (pos >= n) set(0);
        pb.textContent = "멈춤"; pb.setAttribute("aria-label","멈춤");
        timer = setInterval(function(){ if (pos >= n){ stop(); return; } set(pos + 1); }, 750);
        return;
      }
      stop();
      if (a === "first") set(0); else if (a === "last") set(n); else if (a === "prev") set(pos - 1); else if (a === "next") set(pos + 1);
    });
    rng.addEventListener("input", function(){ stop(); set(+rng.value); });
    set(start);
  }
  var NAMES = {R:"실행", W:"대기(선점됨)", B:"blocked", K:"ceiling 때문에 blocked", D:"deadlock"};
  function timeline(box){
    var d = JSON.parse(box.getAttribute("data-tl"));
    var T = d.T, rows = d.rows, cw = d.cw || (T > 40 ? 18 : 28), rh = 30, lw = d.lw || 92, top = 22;
    var W = lw + T * cw + 16, H = top + rows.length * rh + 26;
    var res = d.res || [];
    var sc = document.createElement("div"); sc.className = "tlsc";
    var svg = el("svg", {viewBox: "0 0 " + W + " " + H, width: W, height: H, role: "img", "aria-label": d.title || "시간에 따른 스케줄"});
    sc.appendChild(svg);
    var st = document.createElement("p"); st.className = "tlst"; st.setAttribute("aria-live", "polite");
    var leg = document.createElement("ul"); leg.className = "tlleg";
    var items = [["c-R","실행"]];
    res.forEach(function(r, i){ items.push(["c-r" + (i % 3), d.reslabel ? d.reslabel.replace("{r}", r) : r + " lock한 채 실행"]); });
    items.push(["c-W","대기(선점됨)"]);
    var used = {}; rows.forEach(function(r){ (d.cells[r.id] || []).forEach(function(v){ if (v) used[v.charAt(0)] = 1; }); });
    var NM = Object.assign({}, NAMES, d.names || {});
    if (used.B) items.push(["c-B",NM.B]); if (used.K) items.push(["c-K",NM.K]); if (used.D) items.push(["c-D",NM.D]);
    leg.innerHTML = items.map(function(x){ return '<li><i style="background:var(' + ({"c-R":"--st-run","c-W":"--st-wait","c-B":"--st-blk","c-K":"--st-ceil","c-D":"--st-dead","c-r0":"--st-res1","c-r1":"--st-res2","c-r2":"--st-res3"})[x[0]] + ')"></i>' + x[1] + '</li>'; }).join("") + '<li>▲ release</li><li>▼ deadline</li><li><i style="background:#3aa35b;border-radius:50%"></i>완료</li>';
    var g = el("g", {}); svg.appendChild(g);
    function cls(v){ if (!v) return null; var k = v.charAt(0); if (k === "C"){ var r = v.slice(2).split("+")[0]; return "c-r" + (Math.max(0, res.indexOf(r)) % 3); } return "c-" + k; }
    function draw(p){
      while (g.firstChild) g.removeChild(g.firstChild);
      for (var t = 0; t <= T; t++){
        var x = lw + t * cw;
        g.appendChild(el("line", {x1: x, y1: top - 4, x2: x, y2: top + rows.length * rh, "class": "gl"}));
        if (t % (d.tick || (T > 40 ? 5 : 1)) === 0) g.appendChild(el("text", {x: x, y: top + rows.length * rh + 16, "text-anchor": "middle", "class": "ax"}, num((t + (d.t0 || 0)) * (d.scale || 1))));
      }
      rows.forEach(function(r, i){
        var y = top + i * rh;
        g.appendChild(el("text", {x: 6, y: y + rh / 2 + 4}, r.label));
        var cells = d.cells[r.id] || [], pr = (d.prio || {})[r.id];
        for (var t = 0; t < T; t++){
          var v = cells[t], x = lw + t * cw;
          if (t < p && v){
            g.appendChild(el("rect", {x: x + 1, y: y + 5, width: cw - 2, height: rh - 10, rx: 2, "class": cls(v)}));
            if (v.charAt(0) === "C" && v.slice(2).length * 7 <= cw - 2) g.appendChild(el("text", {x: x + cw / 2, y: y + rh / 2 + 4, "text-anchor": "middle", "class": "cl"}, v.slice(2)));
            if (pr && pr[t] != null && r.base != null && pr[t] !== r.base) g.appendChild(el("text", {x: x + cw - 2, y: y + 9, "text-anchor": "end", "class": "pr"}, String(pr[t])));
          } else if (t >= p && v){
            g.appendChild(el("rect", {x: x + 1, y: y + 5, width: cw - 2, height: rh - 10, rx: 2, "class": "fut"}));
          }
        }
      });
      (d.marks || []).forEach(function(m){
        var i = -1; rows.forEach(function(r, k){ if (r.id === m.row) i = k; });
        if (i < 0) return;
        var y = top + i * rh, x = lw + m.t * cw;
        var shown = (m.type === "rel") ? m.t <= p : m.t <= p;
        if (!shown) return;
        if (m.type === "rel") g.appendChild(el("path", {d: "M" + x + " " + (y + rh - 1) + " l-4 6 h8 z", "class": "mk-rel"}));
        else if (m.type === "dl") g.appendChild(el("path", {d: "M" + x + " " + (y + 1) + " v8 m-4 -4 l4 4 l4 -4", "class": "mk-dl"}));
        else if (m.type === "done") g.appendChild(el("circle", {cx: x, cy: y + rh / 2, r: 4, "class": "mk-done"}));
        else if (m.type === "miss") g.appendChild(el("path", {d: "M" + (x - 5) + " " + (y + 8) + " l10 14 m0 -14 l-10 14", "class": "mk-miss"}));
      });
      var cx = lw + p * cw;
      g.appendChild(el("line", {x1: cx, y1: top - 8, x2: cx, y2: top + rows.length * rh + 4, "class": "cur"}));
      var tn = sc.parentNode.querySelector(".tnow");
      if (tn) tn.textContent = "t = " + num((p + (d.t0 || 0)) * (d.scale || 1)) + " / " + num((T + (d.t0 || 0)) * (d.scale || 1)) + (d.unit ? " " + d.unit : "");
      var s = p - 1, html = "";
      if (s < 0){ html = d.intro || "재생 또는 ▶을 누르면 한 시간 단위씩 진행합니다."; }
      else {
        var run = [], wait = [], blk = [];
        rows.forEach(function(r){
          var v = (d.cells[r.id] || [])[s]; if (!v) return;
          var k = v.charAt(0), nm = r.short || r.label;
          var pr = (d.prio || {})[r.id]; var ptxt = (pr && pr[s] != null && r.base != null && pr[s] !== r.base) ? " (현재 우선순위 " + pr[s] + ")" : "";
          if (k === "R" || k === "C") run.push(nm + (k === "C" ? (d.reslabel ? ": " + v.slice(2) : " [" + v.slice(2) + " lock]") : "") + ptxt);
          else if (k === "W") wait.push(nm + ptxt);
          else blk.push(nm + " " + (Object.assign({}, NAMES, d.names || {}))[k]);
        });
        html = "<b>구간 " + num((s + (d.t0 || 0)) * (d.scale || 1)) + "~" + num((s + 1 + (d.t0 || 0)) * (d.scale || 1)) + (d.unit ? " " + d.unit : "") + "</b> 실행: " + (run.join(", ") || "없음(idle)") + " · 대기: " + (wait.join(", ") || "없음") + (blk.length ? " · " + blk.join(", ") : "");
        var ev = (d.notes || {})[String(s)];
        if (ev) html += "<br>" + ev;
      }
      st.innerHTML = html;
    }
    box.appendChild(sc); box.appendChild(st); box.appendChild(leg);
    var c = controls(box, T, "시간");
    player(c, T, d.start != null ? d.start : 0, draw);
  }
  function frames(box){
    var fr = box.querySelectorAll(".fr"), n = fr.length - 1;
    var dots = document.createElement("div"); dots.className = "dots";
    for (var i = 0; i <= n; i++) dots.appendChild(document.createElement("span"));
    var c = controls(box, n, "단계");
    c.appendChild(dots);
    player(c, n, 0, function(p){
      for (var i = 0; i <= n; i++){ fr[i].hidden = i !== p; dots.children[i].className = i === p ? "on" : ""; }
      c.querySelector(".tnow").textContent = "단계 " + (p + 1) + " / " + (n + 1);
    });
  }
  document.querySelectorAll(".tl").forEach(function(b){ try { timeline(b); } catch(e){ b.textContent = "그림을 그리지 못했습니다: " + e.message; } });
  document.querySelectorAll(".frm").forEach(frames);
})();
</script>
